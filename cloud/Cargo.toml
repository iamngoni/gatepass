[package]
name = "gatepass-backup"
version = "0.1.0"
edition = "2024"
description = "Cloudflare Worker that stores Gatepass's end-to-end encrypted backups."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.8.7", features = ["d1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rsa = { version = "0.9", default-features = false, features = ["std"] }
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit"] }
rand = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
