name: release
on:
  push:
    tags:
      - 'v*'
  # Re-run against an existing tag if a build fails.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to attach the APK to (e.g. v0.1.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    # Self-hosted: register a runner against `iamngoni/gatepass` with the
    # label `x64` (alongside the automatic `self-hosted` and `linux`).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match pubspec version $version"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The default also installs `tools`, which current SDK managers no
      # longer have. Gradle fetches the platform and build tools it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Write the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          keystore="$RUNNER_TEMP/gatepass-release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          cat > android/key.properties <<EOF
          storeFile=$keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=gatepass
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      # The runner container is capped at 2 GB, far below the local 8 GB
      # Gradle heap, so CI uses a small heap, one worker and no daemon.
      - name: Fit Gradle to the runner
        run: |
          free -h || true
          cat /sys/fs/cgroup/memory.max 2>/dev/null || true
          nproc
          sed -i '/^org.gradle.jvmargs=/d' android/gradle.properties
          cat >> android/gradle.properties <<EOF
          org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC
          org.gradle.daemon=false
          org.gradle.workers.max=1
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build the APK
        run: |
          # Phones only: x86_64 is for emulators and costs another AOT build.
          flutter build apk --release --target-platform android-arm,android-arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/gatepass-$TAG.apk"
          cd dist
          sha256sum "gatepass-$TAG.apk" > "gatepass-$TAG.apk.sha256"
          ls -lh

      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/gatepass-${{ env.TAG }}.apk
            dist/gatepass-${{ env.TAG }}.apk.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Remove the signing key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/gatepass-release.jks"
